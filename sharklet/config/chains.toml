# config/chains.toml
#  All supported chain configurations.
#  The bot reads CHAIN_ID from .env and uses the corresponding entry here
#  (or you can override these via the separate .env RPC_URLS variable).

[amoy]
chain_id = 80002
rpc_urls = [
    "https://rpc-amoy.polygon.technology",
    "https://polygon-amoy-bor-rpc.publicnode.com",
]

[polygon]
chain_id = 137
rpc_urls = [
    "https://polygon-mainnet.g.alchemy.com/v2/YOUR_KEY",
    "https://rpc.ankr.com/polygon",
    "https://polygon-rpc.com",
]

[arbitrum]
chain_id = 42161
rpc_urls = [
    "https://arb1.arbitrum.io/rpc",
    "https://rpc.ankr.com/arbitrum",
]

[base]
chain_id = 8453
rpc_urls = [
    "https://mainnet.base.org",
]