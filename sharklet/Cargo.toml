[package]
name = "sharklet"
version = "0.2.0"
edition = "2021"

[dependencies]
ethers = { version = "2", features = ["ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
url = "2"

[profile.release]
opt-level = 3
lto = true
